<!-- ===== RETRO TERMINAL CONSOLE MODAL ===== -->
<div class="terminal-modal" id="terminalModal" hidden>
  <div class="terminal-modal-card" role="dialog" aria-modal="true" aria-labelledby="termTitle">
    <div class="terminal-header">
      <div class="term-dots"><span></span><span></span><span></span></div>
      <h2 id="termTitle" class="term-title">SPIDEY-NET // CONSOLE v2.6.15</h2>
      <button class="close-button" id="closeTerminal" type="button" aria-label="Tutup Terminal">×</button>
    </div>
    <div class="terminal-body" id="terminalOutput"></div>
    <div class="terminal-input-row">
      <span class="term-prompt">&gt;</span>
      <input type="text" id="terminalInput" class="term-input" placeholder="Type a command (e.g. 'help', 'scan', 'list', 'locate London')..." autocomplete="off" />
    </div>
  </div>
</div>

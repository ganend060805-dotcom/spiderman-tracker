<!-- ===== VIDEO MODAL (Trailer Player) ===== -->
<div class="video-modal" id="videoModal" hidden>
  <div class="video-modal-card" role="dialog" aria-modal="true" aria-labelledby="videoModalTitle">
    <button class="close-button" id="closeVideo" type="button" aria-label="Tutup video">×</button>
    <div id="videoFrameContainer" style="width:100%;aspect-ratio:16/9;background:#000;border:2px solid #000;"></div>
    <div>
      <p class="eyebrow">OFFICIAL TRAILER</p>
      <h2 id="videoModalTitle">Spider-Man: Brand New Day</h2>
      <p class="muted">Marvel Studios & Sony Pictures — Now Playing in Theaters.</p>
    </div>
  </div>
</div>

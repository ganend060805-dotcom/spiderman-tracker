<!-- ===== TOP BEZEL BAR ===== -->
<header class="top-bezel" id="topbar">
  <!-- Top Left Orange Spidey Eye Button -->
  <button class="bezel-btn btn-mask-eye" type="button" id="menuToggle" aria-label="Open Menu / Sightings Log" title="Activity Log">
    <img src="../assets/brand/spidey-mask-icon.svg" alt="Spidey Mask Menu" />
  </button>

  <!-- Top Ruler / Grid Ticks Pattern -->
  <div class="bezel-ruler top-ruler" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- Top Center Title Badge [ SPIDEY (mask) TRACKER ] -->
  <button class="center-title-badge" type="button" aria-label="Sync Radar Network" title="Click to Sync Network">
    <span class="pixel-text title-spidey">SPIDEY</span>
    <img class="title-mini-mask" src="../assets/brand/spidey-mask-mini.svg" alt="" aria-hidden="true" />
    <span class="pixel-text title-tracker">TRACKER</span>
  </button>

  <!-- Top Ruler Right -->
  <div class="bezel-ruler top-ruler right-ruler" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- Top Right White Spider Button -->
  <button class="bezel-btn btn-spider-white" type="button" id="helpToggle" aria-label="Help & Information" title="Help">
    <img src="../assets/brand/spider-icon-white.svg" alt="Spider Info" />
  </button>
</header>

<!-- ===== BOTTOM BEZEL TICKER & CONTROLS ===== -->
<div class="bottom-bezel">
  <!-- Pixel Spider-Man Chibi Mascot & Watch Trailer Button (Bottom Left) -->
  <div class="bottom-left-group">
    <div class="chibi-spidey-anchor" aria-hidden="true">
      <img class="chibi-spidey-img" src="../assets/brand/spidey-chibi.svg" alt="" />
    </div>
    <button class="watch-trailer-btn" id="watchTrailerBtn" type="button" aria-label="Watch Trailer" title="Watch Official Spider-Man Trailer">
      <span>WATCH TRAILER</span>
    </button>
  </div>

  <!-- Centered Ticker Marquee Box -->
  <div class="ticker-box-pill" id="tickerBar">
    <button class="ticker-marquee-track" type="button" aria-label="Bagikan Sinyal ke Media Sosial" title="Klik untuk Salin Link / Share">
      <span class="pixel-ticker-text">
        'OUR SPIDEY SIGHTINGS ON X &nbsp;=&nbsp; SHARE YOUR &nbsp;&nbsp;&nbsp;&nbsp; 'OUR SPIDEY SIGHTINGS ON X &nbsp;=&nbsp; SHARE YOUR &nbsp;&nbsp;&nbsp;&nbsp; 'OUR SPIDEY SIGHTINGS ON X &nbsp;=&nbsp; SHARE YOUR &nbsp;&nbsp;&nbsp;&nbsp;
      </span>
    </button>
    <!-- Green Speaker / Sound Toggle Button -->
    <button class="ticker-action-pill" type="button" id="tickerAudioBtn" aria-label="Toggle 8-Bit Audio" title="Nyalakan/Matikan Suara 8-Bit">
      <span class="pixel-speaker-icon">🔊</span>
    </button>
  </div>
</div>

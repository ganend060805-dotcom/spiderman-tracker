<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a2e6e" />
    <meta name="description" content="Spidey Tracker — Track Spider-Man sightings across the globe in retro pixel tech style." />
    <title>Spidey Tracker — Field Network</title>
    <!-- Pixel Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="./styles.css?v=5" />
  </head>
  <body>
    <!-- Top-Right Floating Terminal Tag -->
    <div data-include="./components/terminal-tag.html"></div>

    <!-- Main Screen Container on Deep Blue Background -->
    <div class="screen-wrapper">
      <div class="arcade-chassis" id="appShell">
        <!-- Top Bezel Header -->
        <div data-include="./components/topbar.html"></div>

        <!-- Main Screen Inner (Sidebar + Map Viewport) -->
        <div class="screen-viewport">
          <div data-include="./components/sidebar.html"></div>
          <div data-include="./components/map.html"></div>
        </div>

        <!-- Bottom Bezel Ticker & Controls -->
        <div data-include="./components/ticker.html"></div>
      </div><!-- /arcade-chassis -->

      <!-- Footer Branding -->
      <div data-include="./components/footer.html"></div>
    </div><!-- /screen-wrapper -->

    <!-- Slide-in Info Panel -->
    <div data-include="./components/panel.html"></div>

    <!-- Modals & Overlays -->
    <div data-include="./components/modals/terminal-modal.html"></div>
    <div data-include="./components/modals/intro-modal.html"></div>
    <div data-include="./components/modals/presence-modal.html"></div>
    <div data-include="./components/modals/video-modal.html"></div>
    <div data-include="./components/modals/asset-modal.html"></div>
    <div data-include="./components/modals/toast.html"></div>

    <!-- Core Scripts -->
    <script src="./config.js?v=5"></script>
    <script src="./cms.js?v=5"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="./app.js?v=5"></script>
  </body>
</html>

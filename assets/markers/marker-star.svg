  <rect x="24" y="4" width="4" height="2" fill="#000"/>
  <rect x="2" y="6" width="2" height="4" fill="#000"/>
  <rect x="28" y="6" width="2" height="4" fill="#000"/>
  <rect x="0" y="10" width="2" height="12" fill="#000"/>

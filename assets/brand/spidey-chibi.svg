<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 96" width="88" height="96" shape-rendering="crispEdges">
  <g id="spidey-head">
    <!-- small hanging web -->
    <path d="M70 0v9M66 3h8M67 6h6M68 9h4" stroke="#d8f5ff" stroke-width="2" fill="none"/>
    <path d="M70 9v10" stroke="#58c4d8" stroke-width="1" stroke-dasharray="2 2"><animate attributeName="d" values="M70 9v10;M69 9l3 10;M70 9v10" dur="2s" repeatCount="indefinite"/></path>

    <!-- large stepped Spider-Man mask -->
    <path d="M29 6h30v3h9v5h6v8h4v29h-4v8h-6v6h-9v4H29v-4h-9v-6h-6v-8h-4V22h4v-8h6V9h9Z" fill="#080b14"/>
    <path d="M30 9h28v3h8v6h6v7h3v25h-4v8h-6v6h-9v3H30v-3h-8v-6h-6v-8h-4V25h4v-7h6v-6h8Z" fill="#e63946"/>
    <path d="M30 9h28v3h8v6H22v-4h6v-3h2Z" fill="#ff6971"/>

    <!-- pixel web pattern -->
    <path d="M44 9v52M13 34h62M18 19l52 41M70 19 18 60M23 13c3 14 11 23 21 28M65 13c-3 14-11 23-21 28M19 51c9-6 17-9 25-9M69 51c-9-6-17-9-25-9" stroke="#711b31" stroke-width="2" fill="none" opacity=".85"/>
    <path d="M26 16h36M20 24h48M17 33h54M17 43h54M20 52h48M26 60h36" stroke="#90263d" stroke-width="1" opacity=".65"/>

    <!-- large white pixel eyes -->
    <path d="M16 32h5v-4h15v4h4v17h-5v4H22v-3h-6Z" fill="#05070e"/>
    <path d="M21 33h12v3h3v11h-4v3h-8v-3h-3Z" fill="#fff"/>
    <path d="M48 32h4v-4h15v4h5v18h-5v3H53v-4h-5Z" fill="#05070e"/>
    <path d="M53 33h12v3h3v11h-4v3h-8v-3h-3Z" fill="#fff"/>
    <path d="M23 35h7v2h-7M55 35h7v2h-7" fill="#dcecff"/>

    <!-- eye blink -->
    <g id="blink-lids">
      <path d="M16 37h24v12h-5v4H22v-3h-6Z" fill="#e63946"/>
      <path d="M48 37h24v13h-5v3H53v-4h-5Z" fill="#e63946"/>
      <path d="M17 46h22M49 46h22" stroke="#080b14" stroke-width="2"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.9;.935;.97;1" dur="4.7s" repeatCount="indefinite"/>
    </g>

    <!-- mask shine and chin accent -->
    <path d="M24 18h8v3h-5v4h-4v-4h1Z" fill="#ff9a9e" opacity=".8"/>
    <path d="M31 62h26v4H31Z" fill="#b92137"/>

    <!-- gentle floating animation -->
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0;0 1;0 0" dur="3s" repeatCount="indefinite"/>
  </g>
</svg>
